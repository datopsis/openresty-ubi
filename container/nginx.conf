worker_processes 1;
pid /tmp/openresty/nginx.pid;
error_log /dev/stderr warn;
worker_shutdown_timeout 10s;
events { worker_connections 1024; }
http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log query strings, credentials, cookies, or request bodies.
    log_format minimal '$remote_addr $request_method $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/openresty/client;
    proxy_temp_path /tmp/openresty/proxy;
    fastcgi_temp_path /tmp/openresty/fastcgi;
    uwsgi_temp_path /tmp/openresty/uwsgi;
    scgi_temp_path /tmp/openresty/scgi;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    autoindex off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    lua_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    include /etc/nginx/conf.d/*.conf;
}
